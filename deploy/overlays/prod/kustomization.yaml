apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
replicas:
  # Stateless apart from a per-pod in-memory negative cache; two for
  # availability.
  - name: server
    count: 2
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      # Temporary hostname while symbols.electronjs.org still points at
      # Heroku. The cut-over adds symbols.electronjs.org here.
      - op: replace
        path: /spec/hostnames/0
        value: symbol-server-next.electronjs.org
  - target:
      kind: Deployment
      name: server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /health
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /health
      # No secrets (`secrets = {}` in infra), so no server-secrets Secret is
      # created; without this the pod would never start.
      - op: add
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/optional
        value: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TARGET_HOST, value: artifacts.electronjs.org }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PATH_PREFIX, value: /symbols }
      # Otherwise tokio starts one worker per node CPU (there is no CPU limit).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TOKIO_WORKER_THREADS, value: "2" }
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 128Mi }
          limits: { memory: 512Mi }
