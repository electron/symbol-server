apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - pdb.yaml
replicas:
  # Stateless apart from a per-pod in-memory negative cache; two for
  # availability.
  - name: server
    count: 2
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      # symbol-server-next stays during the overlap with Heroku; drop it once
      # symbols.electronjs.org traffic is confirmed on ionic.
      - op: replace
        path: /spec/hostnames
        value:
          - symbols.electronjs.org
          - symbol-server-next.electronjs.org
  - target:
      kind: Deployment
      name: server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /health
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /health
      # Prefer putting the replicas on different nodes, so draining one node
      # doesn't evict both at once (see also pdb.yaml).
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: server
      # No secrets (`secrets = {}` in infra), so no server-secrets Secret is
      # created; without this the pod would never start.
      - op: add
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/optional
        value: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TARGET_HOST, value: artifacts.electronjs.org }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PATH_PREFIX, value: /symbols }
      # Fetch from the storage account behind artifacts.electronjs.org
      # directly rather than back out through Cloudflare, whose Cloud
      # Connector maps artifacts.electronjs.org/<path> onto this host's
      # /<path> unchanged (the `symbols` container, hence PATH_PREFIX).
      # Redirected clients (Sentry's symbolicator) still go to TARGET_HOST.
      # electron/infra must allow this host in symbol-server's egress_proxy
      # rules before this deploys.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: UPSTREAM_HOST, value: electronartifacts.blob.core.windows.net }
      # Otherwise tokio starts one worker per node CPU (there is no CPU limit).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TOKIO_WORKER_THREADS, value: "2" }
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 128Mi }
          limits: { memory: 512Mi }
  - target:
      kind: Deployment
      name: server
    patch: |-
      # electron/infra runs an egress allowlist for this app (`egress_proxy`
      # in terraform/global/ionic-platform-apps): its own DNS resolver, which
      # answers the allowed hostnames with the egress proxy's address, and the
      # proxy, which allows only the listed host, method and path
      # combinations. Until infra sets `enforce = true` anything else is let
      # through and logged; after that it is refused, the pod cannot reach
      # kube-dns or the internet directly, and admission rejects pods in this
      # namespace without this dnsConfig. The allowed hostnames live only in
      # infra; nothing here names them.
      - op: add
        path: /spec/template/spec/dnsPolicy
        value: None
      - op: add
        path: /spec/template/spec/dnsConfig
        value:
          nameservers:
            - 10.0.0.209
          searches:
            - symbol-server.svc.cluster.local
            - svc.cluster.local
            - cluster.local
          options:
            - name: ndots
              value: "5"
      # The proxy's certificates come from a CA of this app's own, which
      # cert-manager keeps renewed; trust-manager writes only the CA
      # certificate into this ConfigMap, and leaf renewals never change it.
      # EXTRA_CA_CERTS adds it to the bundled webpki roots rather than
      # replacing them (build_client in src/proxy.rs).
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: egress-proxy-trust
          configMap:
            name: symbol-server-egress-trust
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: egress-proxy-trust
          mountPath: /etc/egress-proxy
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: EXTRA_CA_CERTS
          value: /etc/egress-proxy/ca.crt
