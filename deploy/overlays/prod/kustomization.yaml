apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - pdb.yaml
replicas:
  # Stateless apart from a per-pod in-memory negative cache; two for
  # availability.
  - name: server
    count: 2
patches:
  - target:
      kind: HTTPRoute
      name: server
    patch: |-
      # symbol-server-next stays during the overlap with Heroku; drop it once
      # symbols.electronjs.org traffic is confirmed on ionic.
      - op: replace
        path: /spec/hostnames
        value:
          - symbols.electronjs.org
          - symbol-server-next.electronjs.org
  - target:
      kind: Deployment
      name: server
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /health
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /health
      # Prefer putting the replicas on different nodes, so draining one node
      # doesn't evict both at once (see also pdb.yaml).
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: server
      # No secrets (`secrets = {}` in infra), so no server-secrets Secret is
      # created; without this the pod would never start.
      - op: add
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/optional
        value: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TARGET_HOST, value: artifacts.electronjs.org }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: PATH_PREFIX, value: /symbols }
      # Otherwise tokio starts one worker per node CPU (there is no CPU limit).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: TOKIO_WORKER_THREADS, value: "2" }
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 128Mi }
          limits: { memory: 512Mi }
